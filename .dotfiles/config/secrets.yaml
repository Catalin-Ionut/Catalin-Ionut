- shell:
    - command: git-crypt unlock "$HOME/.config/git-crypt/git-crypt.key"
      quiet: true

- conditional:
    if:
      git-decrypted:
        - git
    then:
      - link:
          ~/:
            glob: true
            path: git/.*

- conditional:
    if:
      git-decrypted:
        - ssh
    then:
      - sync:
          ~/.ssh:
            path: ssh
            fmode: 600
            dmode: 700
            options: []
